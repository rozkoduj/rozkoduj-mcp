name: Publish to PyPI

on:
  release:
    types: [published]

# One publish at a time; a re-published release queues instead of racing.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv python install 3.14
      # --frozen: set the version without re-locking. Without it this step
      # resolves and installs the whole dev group, putting a network resolution
      # between a published release and its upload - and the release event does
      # not fire twice, so a transient index failure there needs a manual rerun.
      - name: Set version from release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
