name: Publish to PyPI

on:
  release:
    types: [published]

# One publish at a time; a re-published release queues instead of racing.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.14
      # The project metadata carries the version, so the tag has to agree with
      # it. Checking instead of overwriting keeps one source of truth: a tag cut
      # without the matching bump fails here rather than publishing an artifact
      # whose version was never written down anywhere.
      - name: Version matches the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared=$(uv version --short)
          if [ "$declared" != "${TAG#v}" ]; then
            echo "::error::the project declares $declared but the release tag is ${TAG#v}"
            exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
